name: TP 스킬 검사

# 무엇을 막는가
#   - 내용을 고치고 매니페스트를 다시 산출하지 않은 채 병합되는 것 (C1)
#   - 개정 이력 없이 스킬이 바뀌는 것 (C2) — 배포보호 메모 2층의 핵심 요구
#   - 자리표시자 사건번호가 다시 들어오는 것 (C3)
#   - 플러그인 업로드 단계에서야 발견될 이름·frontmatter 오류 (C4·C5)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # C2는 base와 비교하므로 전체 이력이 필요하다

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 릴리스 검사 (C1~C6)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # checkout이 fetch-depth: 0으로 전체 이력을 받아 두었지만,
            # PR에서는 base 브랜치의 원격추적 ref가 없을 수 있으므로 명시적으로 만든다.
            # ⚠️ `--depth=0`은 git이 거부한다(fatal: depth 0 is not a positive number).
            #    전체 이력이 필요하면 --unshallow이거나, 이미 깊은 저장소면 옵션 자체가 불필요하다.
            git fetch --no-tags --prune origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            # base가 실제로 해석되는지 먼저 확인한다. 못 찾으면 C2가 조용히 건너뛰어진다.
            git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null
            python scripts/check_release.py --base "origin/${{ github.base_ref }}"
          else
            python scripts/check_release.py
          fi

      - name: 플러그인 생성 시험
        run: python build_plugins.py single

      - name: 분할 생성 시험
        run: python build_plugins.py split

  release:
    # 태그를 붙였을 때만 배포본을 만든다. main 병합만으로는 배포되지 않는다.
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 배포본 생성
        # plugin.json의 version은 **태그 이름에서 온다.** build_plugins.py가 git describe로
        # 추론할 수도 있으나, 이 job의 checkout은 fetch-depth 기본값(1)이어서 태그 해석이
        # 환경에 의존한다. 태그 이름을 직접 넘겨 결정적으로 만든다.
        # 계기: v1.2.0 배포본의 plugin.json이 `1.0.0`으로 남아 있었다(2026-08-12 S5에서 발견).
        env:
          TP_PLUGIN_VERSION: ${{ github.ref_name }}
        run: |
          python build_plugins.py single
          python build_plugins.py split
          python - <<'PY'
          import json, glob, os
          want = os.environ["TP_PLUGIN_VERSION"].lstrip("v")
          for p in glob.glob("dist/*/.claude-plugin/plugin.json"):
              got = json.load(open(p, encoding="utf-8"))["version"]
              print(f"{p}: version={got}")
              assert got == want, f"plugin.json version={got} != 태그 {want}"
          print(f"plugin.json version 전건 = {want}")
          PY

      - name: 동결 매니페스트 산출
        run: |
          cd skills
          find . -type f \( -name '*.md' -o -name '*.py' -o -name 'MANIFEST.sha256' \) \
            | sed 's|^\./||' | sort | xargs sha256sum > ../dist/MANIFEST_frozen.sha256
          wc -l < ../dist/MANIFEST_frozen.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: tp-skills-${{ github.ref_name }}
          path: |
            dist/*.plugin
            dist/MANIFEST_frozen.sha256
